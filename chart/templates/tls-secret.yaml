SPDX-License-Identifier: APACHE-2.0
*/}}

{{- if (include "openldap.createTlsSecret" .) }}
{{- $secretName := include "openldap.tlsSecretName" . }}
{{- $existing := (lookup "v1" "Secret" (include "common.names.namespace" .) $secretName).data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
{{- if $existing }}
  tls.crt: {{ index $existing "tls.crt" }}
  tls.key: {{ index $existing "tls.key" }}
  ca.crt: {{ index $existing "ca.crt" }}
{{- else }}
  {{- $ca := genCA "openldap-ca" 3650 }}
  {{- $fullname := include "common.names.fullname" . }}
  {{- $namespace := include "common.names.namespace" . }}
  {{- $headless := include "openldap.headlessServiceName" . }}
  {{- $domain := .Values.clusterDomain }}
  {{- $altNames := list
        $fullname
        (printf "%s.%s" $fullname $namespace)
        (printf "%s.%s.svc" $fullname $namespace)
        (printf "%s.%s.svc.%s" $fullname $namespace $domain)
        (printf "*.%s.%s.svc.%s" $headless $namespace $domain)
        "localhost" }}
  {{- $cert := genSignedCert $fullname (list "127.0.0.1") $altNames 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
{{- end }}
{{- end }}
